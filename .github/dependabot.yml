# Dependabot configuration for Greenline LWSE-V.
# Keep the committed UV lockfile and GitHub Actions current.

version: 2
updates:
  # Project and test dependencies are declared in pyproject.toml and locked in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    reviewers:
      - "andijakl"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      homeassistant:
        patterns:
          - "homeassistant*"
      pytest:
        patterns:
          - "pytest*"
      quality:
        patterns:
          - "pre-commit"
          - "mypy"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    reviewers:
      - "andijakl"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
