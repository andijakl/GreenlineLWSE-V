name: Code Quality

permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Pre-commit quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run pre-commit hooks
        run: uv run --locked --group quality pre-commit run --all-files --show-diff-on-failure
