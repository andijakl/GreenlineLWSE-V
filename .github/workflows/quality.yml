name: Validation

permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  project:
    name: Project validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run complete validation
        run: ./validate.sh

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION=$(uv run --locked python -c "import json; print(json.load(open('custom_components/greenline_lwse_v/manifest.json'))['version'])")
          if [ "${TAG_VERSION#v}" != "$MANIFEST_VERSION" ]; then
            echo "Tag version (${TAG_VERSION#v}) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
